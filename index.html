<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบผลการเรียน - คณิตศาสตร์ทั่วไป</title>
  <style>
    body {
      font-family: "Sarabun", sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1e3a8a;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
    }
    .container {
      max-width: 400px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    h2 {
      margin-top: 0;
      color: #1e3a8a;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      border: none;
      color: white;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .error {
      color: red;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    ระบบผลการเรียน - คณิตศาสตร์ทั่วไป
  </header>
  <div class="container">
    <h2>เข้าสู่ระบบ</h2>
    <input type="text" id="userId" placeholder="รหัสผู้ใช้/รหัสนักศึกษา">
    <input type="password" id="password" placeholder="รหัสผ่าน">
    <button onclick="login()">เข้าสู่ระบบ</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    let usersData = [];

    // โหลด users.csv อัตโนมัติจาก repo
    async function loadUsers() {
      try {
        const response = await fetch('users.csv');
        const text = await response.text();

        const rows = text.trim().split('\\n').map(r => r.split(','));
        const headers = rows[0];
        usersData = rows.slice(1).map(row => {
          let obj = {};
          row.forEach((val, i) => obj[headers[i]] = val);
          return obj;
        });
      } catch (err) {
        document.getElementById('errorMsg').innerText = "ไม่สามารถโหลด users.csv ได้";
      }
    }

    // ตรวจสอบการ login
    function login() {
      const userId = document.getElementById("userId").value.trim();
      const password = document.getElementById("password").value.trim();

      const user = usersData.find(u => u.userId === userId && u.password === password);

      if (!user) {
        document.getElementById("errorMsg").innerText = "รหัสผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
        return;
      }

      if (user.role === "admin") {
        window.location.href = "admin.html"; // อาจารย์ไปหน้า admin
      } else {
        // เก็บ userId ใน localStorage เพื่อใช้ใน student.html
        localStorage.setItem("currentUserId", userId);
        window.location.href = "student.html";
      }
    }

    // โหลด users.csv ตอนเปิดหน้า
    loadUsers();
  </script>
</body>
</html>
